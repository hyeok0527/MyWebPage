{{ if .IsHome }}
<style>
#main-content .portfolio-scroll-section { padding-block: clamp(3rem, 12vh, 8rem); }
#main-content .portfolio-scroll-section > h2 { margin-top: 0; }
@media (prefers-reduced-motion: no-preference) {
  #main-content .portfolio-reveal { opacity: 0; transform: translateY(42px); transition: opacity .85s ease, transform .85s cubic-bezier(.22,1,.36,1); }
  #main-content .portfolio-reveal.is-visible { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  #main-content .portfolio-reveal { opacity: 1; transform: none; transition: none; }
}
@media print {
  #main-content .portfolio-reveal { opacity: 1 !important; transform: none !important; }
}
</style>
<script>
(function () {
  function initPortfolioReveal() {
    const main = document.getElementById('main-content');
    if (!main || main.dataset.portfolioReveal) return;
    main.dataset.portfolioReveal = 'true';
    const prose = main.querySelector('article > section.prose');
    if (prose) {
      const children = Array.from(prose.children);
      let group = null;
      children.forEach(function (node) {
        if (node.tagName === 'H2') {
          group = document.createElement('section');
          group.className = 'portfolio-scroll-section';
          prose.insertBefore(group, node);
        }
        if (group) group.appendChild(node);
      });
    }
    if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const targets = Array.from(main.querySelectorAll('.portfolio-scroll-section'));
    const recent = main.querySelector(':scope > section');
    if (recent) targets.push(recent);
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0, rootMargin: '0px 0px -40px 0px' });
    targets.forEach(function (target) {
      if (target.getBoundingClientRect().top <= window.innerHeight - 40) return;
      observer.observe(target);
      target.classList.add('portfolio-reveal');
      target.addEventListener('focusin', function () {
        target.classList.add('is-visible');
        observer.unobserve(target);
      });
    });
    window.addEventListener('beforeprint', function () {
      targets.forEach(function (target) { target.classList.add('is-visible'); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPortfolioReveal);
  else initPortfolioReveal();
})();
</script>
{{ end }}
