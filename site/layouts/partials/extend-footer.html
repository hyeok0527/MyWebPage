{{ if .IsPage }}
<style>
.article-content.ppt-content{font-size:clamp(1.05rem,1rem + .3vw,1.2rem);line-height:1.7;overflow-wrap:anywhere}
.article-content.ppt-content>.ppt-section{padding:1.5rem 0;scroll-margin-top:2rem}
.article-content.ppt-content>.ppt-section+ .ppt-section{border-top:1px solid rgba(148,163,184,.25)}
.article-content.ppt-content h2{font-size:clamp(1.5rem,1.2rem + 1vw,2rem);line-height:1.35;margin:0 0 .8em}
.article-content.ppt-content p{margin-block:.7em}
.article-content.ppt-content li{margin-block:.25em}
.article-content.ppt-content ul,.article-content.ppt-content ol{margin-block:.7em}
.article-content.ppt-content h3{margin-top:1.25em;margin-bottom:.5em}
.article-content.ppt-about{font-size:clamp(1.125rem,1rem + .5vw,1.4rem);line-height:1.8}
.article-content.ppt-about>.ppt-section{min-height:75svh;display:flex;flex-direction:column;justify-content:center;padding:2rem 0}
.ppt-section>*{max-width:100%}
.ppt-section pre{overflow-x:auto}
@media(max-width:899px){.article-content.ppt-about>.ppt-section{min-height:55svh;padding:1.75rem 0}}
@media print{.article-content.ppt-content>.ppt-section{min-height:0!important;display:block;filter:none!important;opacity:1!important;transform:none!important}}
</style>
<script>
(()=>{const start=()=>{
const body=document.querySelector('.article-content');if(!body||body.classList.contains('ppt-content'))return;
const about=/\/about(?:\/|$)/.test(location.pathname);const project=/\/projects\//.test(location.pathname);if(!about&&!project)return;
const nodes=Array.from(body.childNodes),sections=[];if(!nodes.some(n=>n.nodeType===1&&n.tagName==='H2'))return;
let current=null;nodes.forEach(n=>{if(n.nodeType===1&&n.tagName==='H2'){current=document.createElement('section');current.className='ppt-section';body.insertBefore(current,n);sections.push(current)}if(current)current.appendChild(n)});
body.classList.add('ppt-content');if(about)body.classList.add('ppt-about');
const motion=matchMedia('(prefers-reduced-motion:no-preference)'),desktop=matchMedia('(min-width:900px)');
let pending=false,lockedUntil=0,total=0,last=0,sign=0;
function paint(){pending=false;const h=innerHeight;sections.forEach(s=>{if(!motion.matches){s.style.opacity='';s.style.filter='';s.style.transform='';return}const old=s.style.transform;s.style.transform='none';const r=s.getBoundingClientRect();s.style.transform=old;const incoming=Math.max(0,Math.min(1,(r.top-h*.3)/(h*.65)));const outgoing=Math.max(0,Math.min(1,(h*.15-r.bottom)/(h*.4)));const d=Math.max(incoming,outgoing);s.style.opacity=String(1-d*.4);s.style.filter='blur('+(d*3).toFixed(2)+'px)';s.style.transform='translateY('+(incoming*40-outgoing*12)+'px)';if(s.contains(document.activeElement)){s.style.opacity='1';s.style.filter='none';s.style.transform='none'}})}
function request(){if(!pending){pending=true;requestAnimationFrame(paint)}}
addEventListener('scroll',request,{passive:true});addEventListener('resize',request,{passive:true});document.addEventListener('focusin',request);motion.addEventListener('change',request);
// Threshold stepping only on short desktop About sections. Long content and touch stay native.
addEventListener('wheel',e=>{
if(!about||!desktop.matches||!motion.matches||e.ctrlKey||e.metaKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)||!e.deltaY)return;
if(e.target.closest('input,textarea,select,pre,[contenteditable="true"],dialog'))return;
const y=scrollY,h=innerHeight;const positions=sections.map(s=>{const old=s.style.transform;s.style.transform='none';const r=s.getBoundingClientRect();s.style.transform=old;return {top:r.top+y,height:r.height}});
let i=0;positions.forEach((p,k)=>{if(Math.abs(p.top-32-y)<Math.abs(positions[i].top-32-y))i=k});
const p=positions[i],dir=Math.sign(e.deltaY),target=i+dir,now=performance.now();
if(p.height>h*.92||Math.abs(p.top-32-y)>h*.32)return;
if(target<0||target>=sections.length)return;
e.preventDefault();if(now<lockedUntil)return;
if(now-last>220||dir!==sign)total=0;last=now;sign=dir;
const scale=e.deltaMode===1?16:e.deltaMode===2?h:1;total+=Math.abs(e.deltaY)*scale;
if(total<120)return;total=0;lockedUntil=now+1000;
scrollTo({top:Math.max(0,positions[target].top-32),behavior:'smooth'});
},{passive:false});paint();
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();
</script>
{{ end }}
