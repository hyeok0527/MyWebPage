{{ if .IsPage }}
<style>
.article-content.ppt-content p{margin-block:.3em}

.article-content.ppt-content{font-size:clamp(1.05rem,1rem + .3vw,1.2rem);line-height:1.5;overflow-wrap:anywhere}
.article-content.ppt-content>.ppt-section{padding:1rem 0;scroll-margin-top:2rem}
.article-content.ppt-content>.ppt-section+ .ppt-section{border-top:1px solid rgba(148,163,184,.25)}
.article-content.ppt-content h2{font-size:clamp(1.5rem,1.2rem + 1vw,2rem);line-height:1.35;margin:0 0 .55em}
.article-content.ppt-content p{margin-block:.3em}
.article-content.ppt-content li{margin-block:.1em}
.article-content.ppt-content ul,.article-content.ppt-content ol{margin-block:.3em}
.article-content.ppt-content h3{margin-top:.9em;margin-bottom:.35em}
.article-content.ppt-about{font-size:clamp(1.125rem,1rem + .5vw,1.4rem);line-height:1.55}
.article-content.ppt-about>.ppt-section{min-height:62svh;display:flex;flex-direction:column;justify-content:center;padding:1rem 0}
.ppt-section>*{max-width:100%}
.ppt-section pre{overflow-x:auto}
@media(max-width:899px){.article-content.ppt-about>.ppt-section{min-height:0;padding:1rem 0}}
@media print{.article-content.ppt-content>.ppt-section{min-height:0!important;display:block;filter:none!important;opacity:1!important;transform:none!important}}
@media(prefers-reduced-motion:no-preference){
html.pf-detail-smooth{scroll-behavior:smooth}
.ppt-section{transition:opacity .22s ease-out;}
}
@media(prefers-reduced-motion:reduce){html.pf-detail-smooth{scroll-behavior:auto}.ppt-section{transition:none}}
/* About-only compact prose; leave project typography untouched. */
.article-content.ppt-about{line-height:1.48}
.article-content.ppt-about p{margin-block:.22em}
.article-content.ppt-about li{margin-block:.08em}
.article-content.ppt-about ul,.article-content.ppt-about ol{margin-block:.25em}
.article-content.ppt-about>.ppt-section{min-height:0;padding:1.1rem 0;display:block}
@media(prefers-reduced-motion:reduce),(max-width:899px){.article-content.ppt-about>.ppt-section{filter:none!important}}
@media print{.article-content.ppt-about>.ppt-section{filter:none!important}}
</style>
<script>
(()=>{const start=()=>{
const body=document.querySelector('.article-content');if(!body||body.classList.contains('ppt-content'))return;
const about=/\/about(?:\/|$)/.test(location.pathname);const project=/\/projects\//.test(location.pathname);if(!about&&!project)return;
const nodes=Array.from(body.childNodes),sections=[];if(!nodes.some(n=>n.nodeType===1&&n.tagName==='H2'))return;
let current=null;nodes.forEach(n=>{if(n.nodeType===1&&n.tagName==='H2'){current=document.createElement('section');current.className='ppt-section';body.insertBefore(current,n);sections.push(current)}if(current)current.appendChild(n)});
body.classList.add('ppt-content');if(about)body.classList.add('ppt-about');
document.documentElement.classList.add('pf-detail-smooth');
const motion=matchMedia('(prefers-reduced-motion:no-preference)'),desktop=matchMedia('(min-width:900px)');
// Cache layout measurements; never interleave writes and reads on scroll.
let pending=false,cached=[];
function refreshMetrics(){
 cached=sections.map(s=>({top:s.offsetTop,height:s.offsetHeight}));
 // offsetTop can be relative to a positioned parent; rect is measured only here.
 cached=sections.map(s=>{const r=s.getBoundingClientRect();const shift=Number(s.dataset.shift||0);return {top:r.top+scrollY-shift,height:r.height}});
 request();
}
function paint(){
 pending=false;const h=innerHeight,y=scrollY;
 sections.forEach((s,i)=>{
 const p=cached[i];if(!p)return;
 let opacity=1,shift=0;
 if(motion.matches&&!s.contains(document.activeElement)){
  const top=p.top-y,bottom=top+p.height;
  const incoming=Math.max(0,Math.min(1,(top-h*.3)/(h*.65)));
  const outgoing=Math.max(0,Math.min(1,(h*.15-bottom)/(h*.4)));
  opacity=1-Math.max(incoming,outgoing)*.22;
  shift=incoming*12-outgoing*4;
 }
 const value=opacity.toFixed(3),transform='translateY('+shift.toFixed(2)+'px)';
 if(s.style.opacity!==value)s.style.opacity=value;
 if(s.style.transform!==transform)s.style.transform=transform;
 // About only: at most 0.65px blur, no overlay and no scroll-time layout reads.
 let blur=0;
 if(about&&desktop.matches&&motion.matches&&!s.contains(document.activeElement)){
  const top=p.top-y,bottom=top+p.height;
  const distance=top>h*.68?top-h*.68:bottom<h*.32?h*.32-bottom:0;
  blur=Math.min(.65,distance/(h*.5)*.65);
 }
 const filter=blur<.04?'none':'blur('+blur.toFixed(2)+'px)';
 if(s.style.filter!==filter)s.style.filter=filter;
 s.dataset.shift=String(shift);
 });
}
function request(){if(!pending){pending=true;requestAnimationFrame(paint)}}
addEventListener('scroll',request,{passive:true});
document.addEventListener('focusin',request);
motion.addEventListener('change',request);
let measureTimer=0;
function scheduleMeasure(){clearTimeout(measureTimer);measureTimer=setTimeout(refreshMetrics,100)}
addEventListener('resize',scheduleMeasure,{passive:true});
addEventListener('load',refreshMetrics,{once:true});
body.querySelectorAll('img').forEach(img=>{if(!img.complete)img.addEventListener('load',scheduleMeasure,{once:true})});
if(document.fonts)document.fonts.ready.then(refreshMetrics);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(scheduleMeasure).observe(body);
// Native scrolling while the gesture is active; settle only after a pause.
let gesture=null,settleTimer=0,animationUntil=0;
function cancelGesture(){gesture=null;clearTimeout(settleTimer);settleTimer=0;animationUntil=0}
// The title/header and footer are always outside the snap area.
function outsideSnapArea(ps,y){
 if(!ps.length)return true;
 const first=Math.max(0,ps[0].top-32),last=Math.max(0,ps[ps.length-1].top-32);
 return y<=4||y<first-4||y>last+4;
}
function metrics(){return cached}
function nearest(ps,y){let i=0;ps.forEach((p,k)=>{if(Math.abs(p.top-32-y)<Math.abs(ps[i].top-32-y))i=k});return i}
function settle(){
 if(!gesture)return;const g=gesture;gesture=null;
 if(!desktop.matches||!motion.matches||performance.now()<animationUntil)return;
 const ps=metrics(),h=innerHeight,p=ps[g.index];if(outsideSnapArea(ps,scrollY)||!p||p.height>h*.92)return;
 const delta=scrollY-g.y,dir=Math.sign(delta);if(!dir)return;
 const target=g.index+dir;
 // Leave the first/last section naturally; never trap the page header or footer.
 if(target<0||target>=ps.length)return;
 const distance=Math.abs(ps[target].top-p.top);
 const moved=Math.abs(delta);
 const passed=moved>=distance*.5;
 const fast=g.peak>.85&&moved>Math.min(80,distance*.12);
 const index=(passed||fast)?target:g.index;
 animationUntil=performance.now()+900;
 scrollTo({top:Math.max(0,ps[index].top-32),behavior:'smooth'});
}
addEventListener('wheel',e=>{
 if(!desktop.matches||!motion.matches||e.ctrlKey||e.metaKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)||!e.deltaY)return;
 if(e.target.closest('input,textarea,select,pre,[contenteditable="true"],dialog'))return;
 const now=performance.now();if(now<animationUntil)return;
 const ps=metrics(),h=innerHeight;
 if(outsideSnapArea(ps,scrollY)){cancelGesture();return}
 if(!gesture){const i=nearest(ps,scrollY);if(ps[i].height>h*.92||Math.abs(ps[i].top-32-scrollY)>h*.35)return;
 if((i===0&&e.deltaY<0)||(i===ps.length-1&&e.deltaY>0))return;
 gesture={index:i,y:scrollY,last:now,peak:0}}
 const scale=e.deltaMode===1?16:e.deltaMode===2?h:1;
 const dt=Math.max(16,now-gesture.last);gesture.peak=Math.max(gesture.peak,Math.abs(e.deltaY)*scale/dt);gesture.last=now;
 clearTimeout(settleTimer);settleTimer=setTimeout(settle,220);
},{passive:true});
// Cancel stale wheel settlement for keyboard, links, back-to-top and scrollbar use.
addEventListener('keydown',cancelGesture);
addEventListener('pointerdown',cancelGesture,{passive:true});
addEventListener('click',cancelGesture,{capture:true,passive:true});
addEventListener('touchstart',cancelGesture,{passive:true});
addEventListener('scroll',()=>{if(gesture&&outsideSnapArea(metrics(),scrollY))cancelGesture()},{passive:true});
addEventListener('resize',cancelGesture,{passive:true});
addEventListener('hashchange',cancelGesture);
addEventListener('pagehide',cancelGesture);
[desktop,motion].forEach(q=>q.addEventListener('change',cancelGesture));
refreshMetrics();
};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();
</script>
{{ end }}
